name: Test and Builds Python prueba tecnica

on:
  push:
    branches:
      - feature/**

  pull_request:
    branches:
      - dev
      - lab
      - prod
      - feature/**
    paths:
      - 'client/**'
      - '.github/workflows/python-ci.yaml'

permissions:
  contents: read

jobs:
  test-and-build-python:

    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'lab' && 'lab' || 'dev' }}

    env:
      API_KEY: ${{ secrets.API_KEY }}

    defaults:
      run:
        working-directory: ping

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validar la sintaxis de cliente.py pilas no revisa logica.
        run: python -m compileall src

      - name: Check linting
        working-directory: src
        run: ruff check .
      
      - name: Run  prueba funcional
        run: PYTHONPATH=src pytest -v

      - name: Deploy step (ejemplo)
        run: |
          echo "Usando API KEY $API_KEY"
          echo "Deploying to environment..."

      - name: Deploy por rama
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "🚀 Deploy a PRODUCCIÓN"
          elif [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "🧪 Deploy a LAB"
          else
            echo "🛠 Deploy a DEV"
          fi