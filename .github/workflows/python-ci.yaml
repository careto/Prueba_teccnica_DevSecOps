name: Test and Builds Python prueba tecnica

on:
  push:
    branches:
      - feature/**

  pull_request:
    branches:
      - dev
      - lab
      - prod
      - feature/**
    paths:
      - 'client/**'
      - '.github/workflows/python-ci.yaml'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  test-and-build-python:

    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'lab' && 'lab' || 'dev' }}

    env:
      TARGET_URL: ${{ vars.TARGET_URL }}

    defaults:
      run:
        working-directory: ping

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run analysis
        uses: github/codeql-action/analyze@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validar la sintaxis de cliente.py pilas no revisa logica.
        run: python -m compileall src

      - name: Debug structure
        run: ls -R

      - name: Check linting
        run: ruff check src
      
      - name: Run  prueba funcional
        run: PYTHONPATH=src pytest -v

      - name: Run imprimir URL de destino
        run: |
          echo "Usando variable: $TARGET_URL"

      - name: Definir environment
        id: env
        run: |
          if [ "${{ github.base_ref }}" = "prod" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" = "lab" ]; then
            echo "env=lab" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Mostrar environment
        run: echo "Environment ${{ steps.env.outputs.env }}"